<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>漢字</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>漢</text></svg>">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div id="app">
    <!-- Loading -->
    <div id="loading">
      <div class="loading-kanji">漢</div>
      <div class="loading-text">Loading</div>
    </div>

    <!-- Main -->
    <div id="main" class="hidden">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="onyomi-nav" id="onyomiNav"></div>

      <div class="card-container" id="cardContainer">
        <div class="card" id="card">
          <div class="card-header">
            <div class="header-btns">
              <button class="icon-btn compare-btn" id="compareBtn" aria-label="Compare kanji">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
              </button>
              <button class="icon-btn stroke-btn" id="strokeBtn" aria-label="Stroke order">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
              </button>
            </div>
            <span class="counter" id="counter"></span>
          </div>

          <!-- Compare search -->
          <div class="compare-search hidden" id="compareSearch">
            <input type="text" class="compare-input" id="compareInput" placeholder="search kanji..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <div class="compare-results" id="compareResults"></div>
          </div>

          <!-- Compare tray -->
          <div class="compare-tray" id="compareTray"></div>

          <div class="kanji-display" id="kanjiDisplay" title="Tap a part of the kanji"></div>

          <div class="meanings" id="meanings"></div>

          <div class="readings">
            <div class="reading-group" id="onyomiGroup">
              <span class="reading-label on-label">音</span>
              <span class="reading-values" id="onyomiReadings"></span>
            </div>
            <div class="reading-group" id="kunyomiGroup">
              <span class="reading-label kun-label">訓</span>
              <span class="reading-values" id="kunyomiReadings"></span>
            </div>
          </div>

          <div class="words-section" id="wordsSection">
            <div class="words-list" id="wordsList"></div>
          </div>
        </div>
      </div>

      <div class="nav-hint" id="navHint">swipe to navigate</div>

      <!-- Return to the kanji you jumped from (parts list) -->
      <button class="back-pill" id="backPill" aria-label="Back">
        <span class="back-arrow">&larr;</span><span id="backKanji"></span>
      </button>
    </div>

    <!-- Parts sheet: other kanji sharing a tapped component -->
    <div id="partsSheet" class="parts-sheet" aria-hidden="true">
      <div class="parts-header">
        <div class="parts-chips" id="partsChips"></div>
        <button class="parts-close" id="partsClose" aria-label="Close">&times;</button>
      </div>
      <div class="parts-title" id="partsTitle"></div>
      <div class="parts-grid" id="partsGrid"></div>
    </div>

    <!-- Stroke order modal -->
    <div id="strokeModal" class="stroke-modal hidden">
      <div class="stroke-backdrop" id="strokeBackdrop"></div>
      <div class="stroke-panel">
        <div class="stroke-header">
          <span class="stroke-count" id="strokeCount"></span>
          <button class="stroke-close" id="strokeClose" aria-label="Close">&times;</button>
        </div>
        <div class="stroke-canvas" id="strokeCanvas"></div>
        <div class="stroke-controls">
          <button class="stroke-play" id="strokePlay" aria-label="Play">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
